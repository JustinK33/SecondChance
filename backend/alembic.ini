# Alembic configuration for SecondChance.
#
# The database URL is deliberately NOT set here. `alembic/env.py` pulls it from
# app.core.config.Settings, so there is exactly one source of truth and no
# connection string ever lands in a committed file.
#
#   make migrate                      -> app database (Settings.database_url)
#   DATABASE_URL=... alembic upgrade head -> override for the test database
#
# Run from the `backend/` directory.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

# Timestamped, sortable, human-readable revision filenames.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Interpret timestamps in file_template as UTC so filenames sort consistently
# regardless of where a migration was authored.
timezone = UTC

# sqlalchemy.url is intentionally omitted - see the note above.

[post_write_hooks]
# Keep generated migrations formatted the same way as the rest of the codebase.
hooks = ruff_fix,ruff_format
ruff_fix.type = exec
ruff_fix.executable = %(here)s/.venv/bin/ruff
ruff_fix.options = check --fix --exit-zero REVISION_SCRIPT_FILENAME
ruff_format.type = exec
ruff_format.executable = %(here)s/.venv/bin/ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
