[project]
name = "secondchance-backend"
version = "0.1.0"
description = "SecondChance - AI benefits navigator backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.143.0",
    "uvicorn[standard]==0.41.0",
    "pydantic==2.14.0",
    "pydantic-settings==2.13.0",
    "sqlalchemy==2.1.4",
    "asyncpg==0.32.0",
    "alembic==1.20.0",
    "httpx==0.28.1",
    "google-genai==2.29.0",
    "langgraph==1.2.14",
    "langgraph-checkpoint-postgres==3.1.2",
    "psycopg[binary,pool]==3.2.12",
    "structlog==26.1.0",
    "pyjwt[crypto]==2.12.1",
    "python-multipart==0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.0",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.0",
    "mypy==2.4.0",
    "locust==2.46.7",
    "types-psycopg2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "ASYNC", "S", "RUF", "SIM", "TID"]
ignore = ["S101", "B008", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"alembic/**" = ["E501"]
"scripts/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_decorators = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["langgraph.*", "google.genai.*", "locust.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*", "benchmarks.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "live: hits the real Gemini API; skipped unless RUN_LIVE_GEMINI=1",
    "db: requires a live postgres database",
]
filterwarnings = ["error::DeprecationWarning:app.*"]
